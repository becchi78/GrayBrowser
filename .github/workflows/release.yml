name: Release

# v* タグのpushでのみ起動し、インストーラーをビルドしてDraftのReleaseを作る。
# 公開（Draft解除）は取り消しにくく、公開した瞬間にアプリ内アップデートの配信も
# 始まるため、人が内容を確認してから行う。
on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

# 既定は読み取りのみ。書き込み権限は Release を作るジョブにだけ付与する。
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    # 署名鍵はこの Environment の Secret にだけ置く。Environment 側で v* タグ
    # からの実行に限定し承認者の承認を必須にしてあるため、リポジトリに書き込める
    # だけの人はブランチ上のワークフロー改変では鍵に届かず、タグを切っても承認
    # なしには鍵が使われない。
    environment: release
    steps:
      - uses: actions/checkout@v7

      # ビルド（約10分）より前に、タグと各ファイルのバージョン・CHANGELOGの
      # 不一致で失敗させる。失敗したらこれ以降のステップは実行されない。
      # タグ名はシェルに直接埋め込まず、環境変数経由で渡す。
      - name: Verify tag matches versions and CHANGELOG
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release/check-version.mjs "$TAG"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install frontend deps
        run: npm ci

      # MSIは配布しないためNSISだけを作る。
      # 署名鍵はこのステップにだけ渡す（他のステップ・ジョブには渡さない）。
      # 鍵はパスワード無しで作ってあり、Secretには空文字を登録できないため、
      # パスワードは空文字をここで明示する（未設定だと鍵の復号に失敗しうる）。
      # アップデーター用の成果物（.sig）の生成は署名鍵が要るので、ローカルの開発
      # ビルドに影響しないよう、その有効化の設定はCIのビルドでだけ重ねる。
      - name: Build installer (NSIS)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri build -- --bundles nsis --config src-tauri/tauri.release.conf.json

      # 検証用の配信元・公開鍵の上書き（デバッグビルド限定）が、配布する実行
      # ファイルに残っていないことを確認する。
      - name: Verify release binary has no debug update overrides
        shell: bash
        run: |
          exe="target/release/GrayBrowser.exe"
          if [ ! -f "$exe" ]; then
            echo "error: release binary not found: $exe" >&2
            exit 1
          fi
          if grep -aqE "GB_UPDATE_(ENDPOINT|PUBKEY)" "$exe"; then
            echo "error: debug-only update override found in the release binary" >&2
            exit 1
          fi

      # .sig か latest.json が作れなければここで失敗し、Draftは作られない。
      - name: Collect installer, update manifest and release notes
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          installer="target/release/bundle/nsis/GrayBrowser_${version}_x64-setup.exe"
          signature="$installer.sig"
          for f in "$installer" "$signature"; do
            if [ ! -f "$f" ]; then
              echo "error: not found: $f" >&2
              ls -la target/release/bundle/nsis >&2 || true
              exit 1
            fi
          done
          mkdir release-out
          cp "$installer" release-out/
          node scripts/release/update-manifest.mjs "$TAG" "$signature" > release-out/latest.json
          node scripts/release/release-notes.mjs "$TAG" "release-out/$(basename "$installer")" > release-out/notes.md

      - name: Upload installer, update manifest and notes
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release-out/*
          if-no-files-found: error
          retention-days: 7

  draft-release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download installer, update manifest and notes
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-out

      # 既存のRelease（Draft含む）があれば上書きせず失敗させる。
      # `gh release view <tag>` はDraftを見つけられないため、一覧で調べる。
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -o pipefail
          if gh release list --limit 1000 --json tagName --jq '.[].tagName' | grep -Fxq -- "$TAG"; then
            echo "error: a release for $TAG already exists" >&2
            exit 1
          fi
          gh release create "$TAG" release-out/*-setup.exe release-out/latest.json \
            --draft --verify-tag \
            --title "$TAG" \
            --notes-file release-out/notes.md
