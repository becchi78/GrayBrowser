name: Release

# v* タグのpushでのみ起動し、インストーラーをビルドしてReleaseを作る。
# vX.Y.Z（安定版）はDraftまでしか作らない。公開（Draft解除）は取り消しにくく、
# 公開した瞬間にアプリ内アップデートの配信も始まるため、人が内容を確認してから行う。
# vX.Y.Z-dev.N（開発版）は、開発者モードの利用者だけが受け取る動作確認用の版で、
# Pre-releaseとして直接公開する（下の dev-release ジョブ）。
on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

# 既定は読み取りのみ。書き込み権限は Release を作るジョブにだけ付与する。
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    # 署名鍵はこの Environment の Secret にだけ置く。Environment 側で v* タグ
    # からの実行に限定し承認者の承認を必須にしてあるため、リポジトリに書き込める
    # だけの人はブランチ上のワークフロー改変では鍵に届かず、タグを切っても承認
    # なしには鍵が使われない。
    environment: release
    steps:
      - uses: actions/checkout@v7

      # ビルド（約10分）より前に、タグと各ファイルのバージョン・CHANGELOGの
      # 不一致で失敗させる。失敗したらこれ以降のステップは実行されない。
      # タグ名はシェルに直接埋め込まず、環境変数経由で渡す。
      - name: Verify tag matches versions and CHANGELOG
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release/check-version.mjs "$TAG"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install frontend deps
        run: npm ci

      # MSIは配布しないためNSISだけを作る。
      # 署名鍵はこのステップにだけ渡す（他のステップ・ジョブには渡さない）。
      # 鍵はパスワード無しで作ってあり、Secretには空文字を登録できないため、
      # パスワードは空文字をここで明示する（未設定だと鍵の復号に失敗しうる）。
      # アップデーター用の成果物（.sig）の生成は署名鍵が要るので、ローカルの開発
      # ビルドに影響しないよう、その有効化の設定はCIのビルドでだけ重ねる。
      - name: Build installer (NSIS)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri build -- --bundles nsis --config src-tauri/tauri.release.conf.json

      # 検証用の配信元・公開鍵の上書き（デバッグビルド限定）が、配布する実行
      # ファイルに残っていないことを確認する。
      - name: Verify release binary has no debug update overrides
        shell: bash
        run: |
          exe="target/release/GrayBrowser.exe"
          if [ ! -f "$exe" ]; then
            echo "error: release binary not found: $exe" >&2
            exit 1
          fi
          if grep -aqE "GB_UPDATE_(ENDPOINT|PUBKEY)" "$exe"; then
            echo "error: debug-only update override found in the release binary" >&2
            exit 1
          fi

      # .sig か latest.json が作れなければここで失敗し、Draftは作られない。
      - name: Collect installer, update manifest and release notes
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          installer="target/release/bundle/nsis/GrayBrowser_${version}_x64-setup.exe"
          signature="$installer.sig"
          for f in "$installer" "$signature"; do
            if [ ! -f "$f" ]; then
              echo "error: not found: $f" >&2
              ls -la target/release/bundle/nsis >&2 || true
              exit 1
            fi
          done
          mkdir release-out
          cp "$installer" release-out/
          node scripts/release/update-manifest.mjs "$TAG" "$signature" > release-out/latest.json
          node scripts/release/release-notes.mjs "$TAG" "release-out/$(basename "$installer")" > release-out/notes.md

      - name: Upload installer, update manifest and notes
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release-out/*
          if-no-files-found: error
          retention-days: 7

  # 安定版の経路。開発版タグでは実行しない。
  draft-release:
    if: ${{ !contains(github.ref_name, '-dev.') }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download installer, update manifest and notes
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-out

      # 既存のRelease（Draft含む）があれば上書きせず失敗させる。
      # `gh release view <tag>` はDraftを見つけられないため、一覧で調べる。
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -o pipefail
          if gh release list --limit 1000 --json tagName --jq '.[].tagName' | grep -Fxq -- "$TAG"; then
            echo "error: a release for $TAG already exists" >&2
            exit 1
          fi
          gh release create "$TAG" release-out/*-setup.exe release-out/latest.json \
            --draft --verify-tag \
            --title "$TAG" \
            --notes-file release-out/notes.md

  # 開発版の経路。Draftは認証なしでは取得できず、開発者モードの利用者に配れない
  # ため、Pre-releaseとして公開する。Pre-releaseは releases/latest の対象外なので、
  # 安定版の利用者の更新確認には影響しない。署名鍵のゲート（build ジョブの
  # Environment 承認）は安定版と同じ。
  dev-release:
    if: ${{ contains(github.ref_name, '-dev.') }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    # 固定タグ dev の latest.json を同時に上書きしないよう、実行中のものは
    # 打ち切らずに待たせる。ただし待機できるのは最新の1件だけで、さらに新しい
    # タグが来ると古い待機は取り消される。前の開発版の完了を待ってからタグを打つ。
    concurrency:
      group: dev-channel
      cancel-in-progress: false
    steps:
      - name: Download installer, update manifest and notes
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-out

      # 版ごとの Release は、安定版と同じく既存があれば上書きせず失敗させる。
      # 配布済みの開発版のインストーラーを後から差し替えないため。
      - name: Create versioned pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -o pipefail
          if gh release list --limit 1000 --json tagName --jq '.[].tagName' | grep -Fxq -- "$TAG"; then
            echo "error: a release for $TAG already exists" >&2
            exit 1
          fi
          gh release create "$TAG" release-out/*-setup.exe release-out/latest.json \
            --prerelease --verify-tag \
            --title "$TAG" \
            --notes-file release-out/notes.md

      # 固定タグ dev の Pre-release は、更新の確認先（latest.json の置き場所）に
      # すぎない。無ければ作り、あれば作成を飛ばして latest.json だけ上書きする。
      # 上のステップが失敗した場合はここに到達しないため、実在しない版を指す
      # latest.json が dev に載ることはない。
      - name: Point the dev channel at this build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          DEV_NOTES: 開発版の更新確認用の置き場です。ここにインストーラーはありません。各開発版は、バージョンごとの Pre-release を参照してください。安定版ではありません。
        run: |
          set -o pipefail
          if ! gh release list --limit 1000 --json tagName --jq '.[].tagName' | grep -Fxq -- dev; then
            gh release create dev \
              --prerelease --latest=false \
              --target "$SHA" \
              --title "dev" \
              --notes "$DEV_NOTES"
          fi
          gh release upload dev release-out/latest.json --clobber
