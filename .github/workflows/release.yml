name: Release

# v* タグのpushでのみ起動し、インストーラーをビルドしてReleaseを作る。
# 安定版のDraftまでしか作らない。公開（Draft解除）は取り消しにくく、
# 公開した瞬間にアプリ内アップデートの配信も始まるため、人が内容を確認してから行う。
# 同じビルドを、開発者モードの利用者だけが受け取るDraft版の先行配信（固定タグ dev の
# Pre-release）にも載せる（下の preview-channel ジョブ）。
on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

# 既定は読み取りのみ。書き込み権限は Release を作るジョブにだけ付与する。
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    # 署名鍵はこの Environment の Secret にだけ置く。Environment 側で v* タグ
    # からの実行に限定し承認者の承認を必須にしてあるため、リポジトリに書き込める
    # だけの人はブランチ上のワークフロー改変では鍵に届かず、タグを切っても承認
    # なしには鍵が使われない。
    environment: release
    steps:
      - uses: actions/checkout@v7

      # ビルド（約10分）より前に、タグと各ファイルのバージョン・CHANGELOGの
      # 不一致で失敗させる。失敗したらこれ以降のステップは実行されない。
      # タグ名はシェルに直接埋め込まず、環境変数経由で渡す。
      - name: Verify tag matches versions and CHANGELOG
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release/check-version.mjs "$TAG"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # タグの実行は main で作られたキャッシュしか読めない。release-cache.yml が
      # 同じ shared-key で作ったものを復元するだけにする。ここで保存しても
      # 次のタグからは読めず、容量を食うだけなので保存しない。
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-build
          save-if: false
          workspaces: ". -> target"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install frontend deps
        run: npm ci

      # MSIは配布しないためNSISだけを作る。
      # 署名鍵はこのステップにだけ渡す（他のステップ・ジョブには渡さない）。
      # 鍵はパスワード無しで作ってあり、Secretには空文字を登録できないため、
      # パスワードは空文字をここで明示する（未設定だと鍵の復号に失敗しうる）。
      # アップデーター用の成果物（.sig）の生成は署名鍵が要るので、ローカルの開発
      # ビルドに影響しないよう、その有効化の設定はCIのビルドでだけ重ねる。
      - name: Build installer (NSIS)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri build -- --bundles nsis --config src-tauri/tauri.release.conf.json

      # 検証用の配信元・公開鍵の上書き（デバッグビルド限定）が、配布する実行
      # ファイルに残っていないことを確認する。
      - name: Verify release binary has no debug update overrides
        shell: bash
        run: |
          exe="target/release/GrayBrowser.exe"
          if [ ! -f "$exe" ]; then
            echo "error: release binary not found: $exe" >&2
            exit 1
          fi
          if grep -aqE "GB_UPDATE_(ENDPOINT|PUBKEY)" "$exe"; then
            echo "error: debug-only update override found in the release binary" >&2
            exit 1
          fi

      # .sig か latest.json が作れなければここで失敗し、Draftは作られない。
      - name: Collect installer, update manifest and release notes
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          installer="target/release/bundle/nsis/GrayBrowser_${version}_x64-setup.exe"
          signature="$installer.sig"
          for f in "$installer" "$signature"; do
            if [ ! -f "$f" ]; then
              echo "error: not found: $f" >&2
              ls -la target/release/bundle/nsis >&2 || true
              exit 1
            fi
          done
          mkdir release-out
          cp "$installer" release-out/
          node scripts/release/update-manifest.mjs "$TAG" "$signature" > release-out/latest.json
          # Draft版の先行配信用。署名とインストーラーは同一で、url だけが dev の Release 内を指す。
          # Draft には載せない（draft-release は載せるファイルを名指しする）。
          node scripts/release/update-manifest.mjs "$TAG" "$signature" --channel preview > release-out/latest-preview.json
          node scripts/release/release-notes.mjs "$TAG" "release-out/$(basename "$installer")" > release-out/notes.md

      - name: Upload installer, update manifest and notes
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release-out/*
          if-no-files-found: error
          retention-days: 7

  # 安定版の経路。
  draft-release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download installer, update manifest and notes
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-out

      # 既存のRelease（Draft含む）があれば上書きせず失敗させる。
      # `gh release view <tag>` はDraftを見つけられないため、一覧で調べる。
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -o pipefail
          if gh release list --limit 1000 --json tagName --jq '.[].tagName' | grep -Fxq -- "$TAG"; then
            echo "error: a release for $TAG already exists" >&2
            exit 1
          fi
          gh release create "$TAG" release-out/*-setup.exe release-out/latest.json \
            --draft --verify-tag \
            --title "$TAG" \
            --notes-file release-out/notes.md

  # 開発者モード向けのDraft版の先行配信。Draft は認証なしでは取得できず開発者モードの
  # 利用者に配れないため、同じインストーラーと署名を固定タグ dev の Pre-release
  # にも置く。Pre-release は releases/latest の対象外なので、安定版の利用者の
  # 更新確認には影響しない。署名鍵のゲート（build ジョブの Environment 承認）は
  # 安定版と同じで、配信は人による Draft の確認・公開より先に行われる。
  # draft-release が成功した場合だけ実行する（実在しない版を指さないため）。
  preview-channel:
    runs-on: ubuntu-latest
    needs: draft-release
    permissions:
      contents: write
    # 固定タグ dev を同時に更新しないよう、実行中のものは打ち切らずに待たせる。
    # 待機できるのは最新の1件だけで、さらに新しいタグが来ると古い待機は取り消される。
    # 前の版の完了を待ってからタグを打つ。
    concurrency:
      group: dev-channel
      cancel-in-progress: false
    steps:
      - name: Download installer and preview manifest
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-out

      # 取得先の latest.json を書き換える前に、版数とタグの一致、署名の有無、
      # url が今回のインストーラーを指すことを確認する。
      - name: Verify preview manifest
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          node -e '
            const fs = require("fs");
            const tag = process.env.TAG;
            const m = JSON.parse(fs.readFileSync("release-out/latest-preview.json", "utf8"));
            const p = m.platforms && m.platforms["windows-x86_64"];
            const version = tag.replace(/^v/, "");
            const url = `https://github.com/${process.env.REPO}/releases/download/dev/GrayBrowser_${version}_x64-setup.exe`;
            const errors = [];
            if (m.version !== version) errors.push(`version ${m.version} != ${version}`);
            if (!p || typeof p.signature !== "string" || p.signature === "") errors.push("signature is empty");
            if (!p || p.url !== url) errors.push(`url ${p && p.url} != ${url}`);
            if (!fs.existsSync(`release-out/GrayBrowser_${version}_x64-setup.exe`)) errors.push("installer not found");
            if (errors.length) { console.error(errors.join("; ")); process.exit(1); }
          '

      # 固定タグ dev の Release は、更新の確認先とインストーラーの置き場。
      # 順序は、アップロード → latest.json の切り替え → 古い版の削除。
      # latest.json が指すファイルが存在してから切り替え、削除は切り替えの後に
      # 行うので、どの時点でも latest.json は実在するインストーラーを指す。
      - name: Publish to the dev channel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          DEV_NOTES: 開発者モード向けのDraft版の先行配信の置き場です。公開前の版で、動作確認用です。不安定な場合があります。安定版は Releases の最新版を参照してください。
        run: |
          set -o pipefail
          version="${TAG#v}"
          installer="GrayBrowser_${version}_x64-setup.exe"
          # 一覧を変数に受けてから判定する。パイプで直接 grep -q に渡すと、grep が先に
          # 終了して gh が SIGPIPE を受け、pipefail で「無い」と誤判定しうる。
          releases="$(gh release list --limit 1000 --json tagName --jq '.[].tagName')"
          if ! grep -Fxq -- dev <<< "$releases"; then
            gh release create dev \
              --prerelease --latest=false \
              --target "$SHA" \
              --title "dev" \
              --notes "$DEV_NOTES"
          fi
          # 同じ版の再実行では、--clobber が既存の同名アセットを消してから上げ直すため、
          # その間だけ latest.json の指す先が無い。再実行は人が行う稀な復旧操作で、
          # 窓は短く、更新の確認が失敗しても次回の確認で取り戻せるので許容する。
          gh release upload dev "release-out/$installer" --clobber
          cp release-out/latest-preview.json release-out/latest.json
          gh release upload dev release-out/latest.json --clobber
          # 今回以外のインストーラーを削除する。
          # grep が1件も選ばない（古い版が無い）場合の終了コード1は正常。
          stale="$(gh release view dev --json assets --jq '.assets[].name' | grep -E -- '-setup\.exe$' | grep -Fxv -- "$installer" || true)"
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            gh release delete-asset dev "$name" --yes
          done <<< "$stale"
